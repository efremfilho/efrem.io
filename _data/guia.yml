  ai_lens: "Generative AI"
  computational_lens: "Computational thinking"
  project_lens: "In your project"
  cycle:
    - title: "Ask"
      question: "What do I want to try — and what am I assuming?"
    - title: "Try and use"
      question: "What can I build and put to use to find out?"
    - title: "Analyze"
      question: "What happened? What can I still not explain?"
    - title: "Decide the next round"
      question: "Improve, change the bet, keep it, or stop?"
  cycle_return: "↺ What happened changes the next question. One round may be short or span several chapters."
  parts:
    - title: "Could this help?"
      description: "A promise to predict dropout becomes a list that helps organize contacts. Building and using this first delivery exposes gaps, costs, and consequences the team had not anticipated."
      ai: "Ask and read; investigate how the model learns and generates responses, where it fails, and who is affected."
      computational: "Separate input, rule, and output; compare expectations with observations before automating."
      project: "Which attempt made your hypothesis more interesting — or more doubtful?"
    - title: "How can we build together without losing what we learned?"
      description: "The list needs to work without depending on one person. The team divides the building work, runs into different interpretations, and tries to preserve rules, corrections, and decisions when combining the pieces."
      ai: "Organize context and sources; decide what calls for interpretation and what can become a procedure."
      computational: "Draw flows, separate functions and layers, repeat tasks with scripts, and keep versions and decisions."
      project: "What can you now reproduce, check, and change without losing what you learned?"
    - title: "What changes when others depend on it?"
      description: "Operating brings questions the demo did not answer. The team changes the delivery while others need it. Expansion opens another round of questions; the project continues beyond the last page."
      ai: "Work with other media and delegate actions; check results and answer for choices."
      computational: "Connect the parts, control access and changes, and keep the product or service working."
      project: "What question did actual use bring back — and how can you investigate without abandoning those who depend on the delivery?"
