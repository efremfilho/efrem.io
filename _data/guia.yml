  parts:
    - title: "Será que isso ajuda?"
      description: "Uma promessa de prever abandono vira uma lista que ajuda a organizar contatos. Ao construir e usar essa primeira entrega, o time encontra lacunas, custos e consequências que não tinha previsto."
      ai: "Pedir e ler; investigar como o modelo aprende e gera respostas, onde erra e quem é afetado."
      computational: "Separar entrada, regra e saída; comparar o esperado com o observado antes de automatizar."
      project: "Que tentativa deixou sua hipótese mais interessante — ou mais duvidosa?"
      closing_title: "O que consolidamos antes de sair automatizando?"
      closing_summary: "Neste primeiro ato, desmontamos a mágica: vimos que nem toda automação é aprendizado, que treinar é descobrir pesos a partir de exemplos que sempre deixam algo de fora, e que um modelo de linguagem calcula a continuação plausível, não a verdade. Quando essa engrenagem encontra a rua, aparecem três limites que nenhuma ferramenta resolve sozinha: quem a fila deixa esperando, de quem são os dados e quanto custa manter a conta ligada. O time da Lia começou querendo prever abandono e terminou o ato com algo muito mais útil: uma primeira lista funcionando, com regras claras do que não fazer."
      recap:
        - "Distinguir regra escrita de padrão aprendido muda onde procurar o erro."
        - "Treinar é achar pesos que reduzem um erro medido; o que não vira coluna não entra na conta."
        - "Tokens, embeddings e atenção geram o plausível; afirmar exige fonte que dê para conferir."
        - "Todo conjunto de dados é um recorte, e toda ordenação de fila é uma escolha humana."
        - "Recortar, borrar, minimizar e usar dado fictício vêm antes de apertar enviar."
        - "Começar pelo modelo mais capaz para descobrir e descer quando a tarefa está provada."
      closing_checkpoint: "Antes de passar para o Ato 2, olhe para a sua primeira tentativa: você já sabe dizer qual parte dela segue uma regra fixa, qual depende de interpretação da IA, que dados não deveriam entrar ali e quem fica esperando quando ela erra?"
      cheatsheet_flow:
        - "1. Pergunta → É regra escrita ou padrão aprendido?"
        - "2. Dados → O que virou coluna e o que ficou de fora?"
        - "3. Saída → Fluência é probabilidade, não verdade"
        - "4. Limites → Quem espera na fila, que dado proteger e quanto custa"
      cheatsheet_do:
        - "Comece pelo modelo mais capaz para descobrir se a ideia para em pé; desça quando a tarefa estiver provada."
        - "Recorte, borre, minimize e use dados fictícios antes de subir qualquer exemplo."
        - "Peça a fonte junto de toda afirmação factual e confira fora da conversa."
      cheatsheet_avoid:
        - "Dizer 'a IA decidiu' e esquecer quem escolheu os dados, a meta e o limite da fila."
        - "Fazer fine-tuning para injetar conhecimento que caberia como contexto."
        - "Colar planilha com nome, CPF, endereço ou dado sensível em assistente aberto."
    - title: "Como construir junto sem perder o que aprendemos?"
      description: "A lista precisa funcionar sem depender de uma pessoa. O time divide a construção, esbarra em interpretações diferentes e tenta preservar regras, correções e decisões ao juntar o trabalho."
      ai: "Organizar contexto e fontes; decidir o que pede interpretação e o que pode virar procedimento."
      computational: "Desenhar fluxos, dividir funções e camadas, repetir com scripts e guardar versões e decisões."
      project: "O que agora você consegue reproduzir, conferir e mudar sem perder o que aprendeu?"
      closing_title: "Como as peças da bancada de construção se encaixam?"
      closing_summary: "O segundo ato montou a nossa bancada de engenharia para quem constrói lendo. Aprendemos a quebrar um problema em fluxo, módulos e camadas (frente, regras e dados conversando por APIs), a dar contexto na medida certa sem afogar a janela, a consultar fontes antes de responder e a separar o que pede interpretação da IA do que exige script determinístico. Por fim, tiramos o projeto da memória curta do chat e o levamos para um repositório versionado, com ambiente e chaves isolados. O trabalho deixou de depender da cabeça de uma única pessoa."
      recap:
        - "Decompor o fluxo e separar frente, regras, dados e domínios permite fatiar o projeto."
        - "A janela de contexto é a memória de trabalho: instruções na altitude certa vencem o excesso."
        - "Recuperar trechos da fonte certa antes de gerar resposta — e saber dizer quando não achou."
        - "Onde a regra é exata e precisa se repetir, peça o código determinístico em vez da resposta no chat."
        - "Repositório guarda versões, decisões, porquês, cicatrizes de erros e scripts de conferência."
        - "Pastas organizam frentes; permissões, segredos e limites de gasto cercam o ambiente."
      closing_checkpoint: "Olhe para onde mora o seu projeto hoje: se outra pessoa (ou outro agente) abrir essa pasta amanhã, ela encontra o mini-PRD, as instruções com as regras que não podem ser desfeitas, o script das contas repetitivas e os casos de teste?"
      cheatsheet_flow:
        - "1. Decompor → Fluxo, domínios e camadas (frente, regras, dados)"
        - "2. Orientar → Contexto na altitude certa + busca na fonte vigente"
        - "3. Calcular → Código determinístico nas contas; IA só na ambiguidade"
        - "4. Guardar → Repositório com decisões, invariantes e script de auditoria"
      cheatsheet_do:
        - "Abra conversa limpa quando mudar de assunto (o histórico inteiro é reenviado a cada mensagem)."
        - "Peça o script e teste com casos conhecidos sempre que a regra precisar se repetir igual."
        - "Registre no AGENTS.md as cicatrizes de bugs que nenhum agente pode desfazer."
      cheatsheet_avoid:
        - "Despejar o manual de 300 páginas e atas antigas na janela achando que 'mais é melhor'."
        - "Pedir para o modelo somar ou filtrar no olhômetro o que uma função faz sem errar."
        - "Usar uma chave de API geral sem limite de gasto ou deixar decisões só no histórico do chat."
    - title: "O que muda quando outras pessoas dependem disso?"
      description: "A operação traz perguntas que a demonstração não respondeu. O time muda a entrega enquanto outras pessoas precisam dela. A expansão abre outra rodada de perguntas; o projeto continua depois da última página."
      ai: "Trabalhar com outras mídias e delegar ações; conferir resultados e responder pelas escolhas."
      computational: "Integrar as partes, controlar acesso e mudanças e manter o produto ou serviço funcionando."
      project: "Que pergunta o uso real devolveu — e como investigar sem abandonar quem depende da entrega?"
      closing_title: "Da tela funcionando ao serviço pelo qual você responde"
      closing_summary: "No terceiro ato, saímos da nossa tela e fomos para a rua. Vimos que gerar um aplicativo ficou rápido, mas descobrir o problema certo, fatiar a entrega e observar o uso real continuam exigindo produto e empatia. Expandimos para voz, imagem e vídeo — onde conferir dá mais trabalho e o dado é mais sensível —, desenhamos rédeas de acesso e aprovação para agentes que executam ações no mundo e encaramos a diferença entre emitir uma saída no sistema e resolver o problema de alguém. A autonomia não termina quando o código roda: ela começa quando você sabe ler, revisar e responder pelo que colocou no ar."
      recap:
        - "Fatiar por domínio e camada, testar na mão de quem usa e lembrar que código não é a parte difícil."
        - "Voz, imagem e vídeo exigem separar o que foi capturado do que o modelo deduziu para completar."
        - "Muitos podem pedir, poucos aprovam ações sem volta e o agente nunca aprova a si mesmo."
        - "Medir resultado na vida de quem usa, não métrica de vaidade, pensando o serviço como um todo."
        - "Construir lendo: usar a expertise em linguagem natural sem abrir mão do pensamento crítico e da responsabilidade."
      closing_checkpoint: "Feche esta volta olhando para o seu projeto em uso: o que já pode rodar como rotina vigiada, o que ainda exige aprovação humana antes de agir, como alguém afetado por um erro consegue contestar e qual é a única aposta que vale a próxima volta?"
      cheatsheet_flow:
        - "1. Fatiar → Um domínio por vez (dados → regras → frente)"
        - "2. Observar → Pôr na mão de quem usa e olhar em silêncio"
        - "3. Cercar → Muitos pedem, agente propõe, poucos aprovam ação sem volta"
        - "4. Responder → Construir lendo e medir resultado real na ponta"
      cheatsheet_do:
        - "Debata o problema antes de gerar a tela e pergunte ao gerador o que ele presumiu sozinho."
        - "Em áudio e imagem, guarde o original e separe o que foi lido do que foi deduzido."
        - "Quebre a trifeta letal (dados privados + texto externo + ação para fora) na arquitetura."
      cheatsheet_avoid:
        - "Confundir lista emitida ou painel bonito com problema resolvido na rua."
        - "Dar permissão para o agente aprovar a própria ação ou esconder o projeto da área de TI."
        - "Ser mera proxy de uma IA para outra sem ler o plano e sem conseguir explicar a entrega."
