  parts:
    - title: "Could this help?"
      description: "A promise to predict dropout becomes a list that helps organize contacts. Building and using this first delivery exposes gaps, costs, and consequences the team had not anticipated."
      ai: "Ask and read; investigate how the model learns and generates responses, where it fails, and who is affected."
      computational: "Separate input, rule, and output; compare expectations with observations before automating."
      project: "Which attempt made your hypothesis more interesting — or more doubtful?"
      closing_title: "What did we consolidate before rushing to automate?"
      closing_summary: "In this first act, we took the magic apart: we saw that not all automation is learning, that training means finding weights from examples that always leave something out, and that a language model computes a plausible continuation rather than the truth. When that machinery meets the street, three limits appear that no tool solves on its own: who the queue leaves waiting, whose data is at stake, and what it costs to keep the meter running. Lia's team started out wanting to predict dropout and finished the act with something far more useful: a working first list, with clear rules on what not to do."
      recap:
        - "Distinguishing written rules from learned patterns changes where you look when things fail."
        - "Training finds weights that reduce a measured error; what isn't a column doesn't enter the math."
        - "Tokens, embeddings, and attention generate what is plausible; claims require a checkable source."
        - "Every dataset is a slice of reality, and every queue ranking is a human choice."
        - "Cropping, blurring, minimizing, and using fictional data come before hitting send."
        - "Start with the most capable model to discover what works, then step down once the task is proven."
      closing_checkpoint: "Before moving to Act 2, look at your first attempt: can you already tell which part follows a fixed rule, which part depends on AI interpretation, which data should never enter it, and who is left waiting when it gets something wrong?"
      cheatsheet_flow:
        - "1. Question → Written rule or learned pattern?"
        - "2. Data → What became a column and what was left out?"
        - "3. Output → Fluency is probability, not truth"
        - "4. Limits → Who waits in the queue, what data to protect, and what it costs"
      cheatsheet_do:
        - "Start with the most capable model to see if the idea holds up; step down once the task is proven."
        - "Crop, blur, minimize, and use fictional data before uploading any example."
        - "Request the source alongside every factual claim and verify it outside the chat."
      cheatsheet_avoid:
        - "Saying 'the AI decided' and forgetting who chose the data, the target, and the queue threshold."
        - "Fine-tuning to inject knowledge that would fit cleanly as context."
        - "Pasting spreadsheets with names, IDs, addresses, or sensitive data into an open assistant."
    - title: "How can we build together without losing what we learned?"
      description: "The list needs to work without depending on one person. The team divides the building work, runs into different interpretations, and tries to preserve rules, corrections, and decisions when combining the pieces."
      ai: "Organize context and sources; decide what calls for interpretation and what can become a procedure."
      computational: "Draw flows, separate functions and layers, repeat tasks with scripts, and keep versions and decisions."
      project: "What can you now reproduce, check, and change without losing what you learned?"
      closing_title: "How do the pieces of the building workbench fit together?"
      closing_summary: "The second act assembled our engineering workbench for building by reading. We learned to break a problem into flows, modules, and layers (front, rules, and data talking through APIs), supply context at the right altitude without flooding the window, retrieve sources before answering, and separate what needs AI interpretation from what demands a deterministic script. Finally, we moved the project out of short-term chat memory into a versioned repository, with isolated environments and keys. The work no longer depends on a single person's head."
      recap:
        - "Decomposing the flow and separating front, rules, data, and domains lets you slice the project."
        - "The context window is working memory: instructions at the right altitude beat dumping everything in."
        - "Retrieve passages from the right source before generating an answer — and know how to say when nothing was found."
        - "Where the rule is exact and must repeat, ask for deterministic code instead of a chat answer."
        - "A repository keeps versions, decisions, reasons, incident scars, and checking scripts."
        - "Folders organize workstreams; permissions, secrets, and spending limits fence the environment."
      closing_checkpoint: "Look at where your project lives today: if another person (or another agent) opens that folder tomorrow, will they find the mini-PRD, the standing instructions with invariants that must not be undone, the script for repetitive math, and the test cases?"
      cheatsheet_flow:
        - "1. Decompose → Flow, domains, and layers (front, rules, data)"
        - "2. Guide → Context at the right altitude + lookup in current sources"
        - "3. Compute → Deterministic code for math; AI only for ambiguity"
        - "4. Store → Repository with decisions, invariants, and audit script"
      cheatsheet_do:
        - "Start a clean chat when switching topics (the entire history is resent with every message)."
        - "Ask for a script and test it against known cases whenever a rule must repeat identically."
        - "Record in AGENTS.md the incident scars and invariants no agent is allowed to undo."
      cheatsheet_avoid:
        - "Dumping a 300-page manual and old meeting notes into the window assuming 'more is better'."
        - "Asking the model to eyeball sums or filters that a function computes without error."
        - "Sharing a general API key without a spending cap or leaving decisions only in chat history."
    - title: "What changes when others depend on it?"
      description: "Operating brings questions the demo did not answer. The team changes the delivery while others need it. Expansion opens another round of questions; the project continues beyond the last page."
      ai: "Work with other media and delegate actions; check results and answer for choices."
      computational: "Connect the parts, control access and changes, and keep the product or service working."
      project: "What question did actual use bring back — and how can you investigate without abandoning those who depend on the delivery?"
      closing_title: "From a working screen to a service you answer for"
      closing_summary: "In the third act, we left our own screen and went out into the field. We saw that generating an app got fast, but discovering the right problem, slicing the delivery, and watching real use still demand product sense and empathy. We expanded to voice, images, and video — where checking takes more work and data is more sensitive —, designed access and approval leashes for agents that take action in the world, and faced the gap between emitting an output in the system and solving someone's problem. Autonomy doesn't end when the code runs: it begins when you know how to read, review, and answer for what you put live."
      recap:
        - "Slice by domain and layer, test in the hands of real users, and remember that code isn't the hard part."
        - "Voice, image, and video require separating what was captured from what the model deduced to fill in gaps."
        - "Many can ask, few approve irreversible actions, and the agent never approves itself."
        - "Measure outcomes in users' lives rather than vanity metrics, thinking of the service as a whole."
        - "Build by reading: use expertise in natural language without giving up critical thinking and accountability."
      closing_checkpoint: "Close this round by looking at your project in use: what can already run as a monitored routine, what still requires human approval before acting, how can someone harmed by an error challenge it, and what is the single bet worth the next round?"
      cheatsheet_flow:
        - "1. Slice → One domain at a time (data → rules → front)"
        - "2. Observe → Put it in users' hands and watch in silence"
        - "3. Fence → Many ask, agent proposes, few approve irreversible actions"
        - "4. Answer for it → Build by reading and measure real-world outcomes"
      cheatsheet_do:
        - "Debate the problem before generating screens and ask the builder what it assumed on its own."
        - "For audio and images, keep the original and separate what was captured from what was deduced."
        - "Break the lethal trifecta (private data + untrusted text + external action) in the architecture."
      cheatsheet_avoid:
        - "Confusing an issued list or a pretty dashboard with solving the problem in the field."
        - "Allowing an agent to approve its own actions or hiding what you built from IT."
        - "Being a mere proxy from one AI to another without reading the plan or explaining the delivery."
