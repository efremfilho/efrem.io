  cycle:
    - title: "Perguntar"
      question: "O que quero tentar — e o que estou supondo?"
    - title: "Tentar e usar"
      question: "O que consigo construir e pôr em uso para descobrir?"
    - title: "Analisar"
      question: "O que aconteceu? O que ainda não sei explicar?"
    - title: "Decidir a próxima volta"
      question: "Melhorar, mudar a aposta, manter ou parar?"
  cycle_return: "↺ O que aconteceu muda a próxima pergunta. Uma volta pode durar pouco ou atravessar vários capítulos."
  parts:
    - title: "Será que isso ajuda?"
      description: "Uma promessa de prever abandono vira uma lista que ajuda a organizar contatos. Ao construir e usar essa primeira entrega, o time encontra lacunas, custos e consequências que não tinha previsto."
      ai: "Pedir e ler; investigar como o modelo aprende e gera respostas, onde erra e quem é afetado."
      computational: "Separar entrada, regra e saída; comparar o esperado com o observado antes de automatizar."
      project: "Que tentativa deixou sua hipótese mais interessante — ou mais duvidosa?"
    - title: "Como construir junto sem perder o que aprendemos?"
      description: "A lista precisa funcionar sem depender de uma pessoa. O time divide a construção, esbarra em interpretações diferentes e tenta preservar regras, correções e decisões ao juntar o trabalho."
      ai: "Organizar contexto e fontes; decidir o que pede interpretação e o que pode virar procedimento."
      computational: "Desenhar fluxos, dividir funções e camadas, repetir com scripts e guardar versões e decisões."
      project: "O que agora você consegue reproduzir, conferir e mudar sem perder o que aprendeu?"
    - title: "O que muda quando outras pessoas dependem disso?"
      description: "A operação traz perguntas que a demonstração não respondeu. O time muda a entrega enquanto outras pessoas precisam dela. A expansão abre outra rodada de perguntas; o projeto continua depois da última página."
      ai: "Trabalhar com outras mídias e delegar ações; conferir resultados e responder pelas escolhas."
      computational: "Integrar as partes, controlar acesso e mudanças e manter o produto ou serviço funcionando."
      project: "Que pergunta o uso real devolveu — e como investigar sem abandonar quem depende da entrega?"
