<!DOCTYPE html>
<html lang="{{ page.lang | default: 'pt-BR' }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% if page.title %}{{ page.title }} — Éfrem Maranhão Filho{% else %}Hi, I'm Éfrem. — Product Builder &amp; Professor{% endif %}</title>
	<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}Éfrem Maranhão Filho — (open-source) product builder. AI agents, GenAI and tech for non-technical people at FGV-EPPG and Unieuro.{% endif %}">
	<meta name="theme-color" content="#0b0d14">
	<link rel="icon" type="image/png" href="/assets/images/favicon.png">
	<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
	<link rel="canonical" href="{{ page.url | absolute_url }}">
	
	<!-- OpenGraph & Twitter -->
	<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Hi, I'm Éfrem.{% endif %}">
	<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}Product Builder &amp; Professor. AI agents, GenAI and tech for non-technical people.{% endif %}">
	<meta property="og:image" content="{{ '/assets/images/share.jpg' | absolute_url }}">
	<meta name="twitter:card" content="summary_large_image">
	
	<!-- Fonts & CSS -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;750;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/style.css">
	
	<!-- RSS Feed -->
	<link rel="alternate" type="application/atom+xml" title="Feed — efrem.io" href="/feed.xml">
</head>
<body>
	<main>
		{{ content }}
		
		<footer>
			<span>&copy; {{ 'now' | date: "%Y" }} &Eacute;frem Maranh&atilde;o Filho &middot; Brazil</span>
			<span><a href="/feed.xml" title="Atom/RSS Feed">RSS</a> &middot; <a href="https://github.com/efremfilho" target="_blank" rel="noopener">GitHub</a> &middot; <a href="https://www.linkedin.com/in/efremfilho/" target="_blank" rel="noopener">LinkedIn</a></span>
		</footer>
	</main>
</body>
</html>
