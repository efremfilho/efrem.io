title: "Éfrem Maranhão Filho"
description: "Product Builder & Professor. Textos e reflexões sobre IA, agentes, produtos digitais e engenharia de contexto."
url: "https://efrem.io"

permalink: /blog/:categories/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# A página principal e os assets são servidos como arquivos estáticos ou layouts Jekyll.
# Os atalhos /algo ficam em redirects/, um arquivo por rota, usando redirect_to
# do plugin jekyll-redirect-from (suportado nativamente pelo GitHub Pages).
