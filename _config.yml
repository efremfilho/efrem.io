title: "Éfrem Maranhão Filho"
description: "Product Builder & Professor. Articles and practical thoughts on AI agents, digital products, and context engineering."
url: "https://efrem.io"

permalink: /blog/:categories/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "_posts/pt"
      type: "posts"
    values:
      categories: "pt"
  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      categories: "en"

  - scope:
      path: ""
      type: "guia"
    values:
      layout: "guia"
      guia: true

# Guia "IA sem mágica" (/ia/ em PT, /ai/ em EN). Cada capítulo define o próprio permalink.
collections:
  guia:
    output: true

plugins:
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# A página principal e os assets são servidos como arquivos estáticos ou layouts Jekyll.
# Os atalhos /algo ficam em redirects/, um arquivo por rota, usando redirect_to
# do plugin jekyll-redirect-from (suportado nativamente pelo GitHub Pages).

# Arquivos da raiz que não são páginas do site. Esta lista substitui a padrão do Jekyll 3
# e a do GitHub Pages, por isso CNAME, Gemfile, node_modules e vendor aparecem aqui também.
# temp/ é material de trabalho local.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - temp
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
